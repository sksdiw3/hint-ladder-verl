# Online turn-level L1 on the full ALFWorld train panel, tuned for step time.
# Same objective, prompt, model and validation panel as train_full.yaml.
# Parent is the flat L3 config; extends may not nest, so train_full.yaml's
# overrides are repeated here and the speed-related keys are marked "fast".
extends: [../l3_train1500/train.yaml]

# --- unchanged experiment definition (copied from train_full.yaml) ---------
actor_rollout_ref.model.path: /models/Qwen3-4B
actor_rollout_ref.actor.optim.lr: 1.0e-6
actor_rollout_ref.actor.ppo_mini_batch_size: 256
actor_rollout_ref.actor.use_invalid_action_penalty: false
actor_rollout_ref.actor.pg_loss_coef: 0.0
actor_rollout_ref.actor.sdl_loss_coef: 1.0
actor_rollout_ref.rollout.temperature: 0.6
actor_rollout_ref.rollout.top_p: 0.95
actor_rollout_ref.rollout.top_k: 20
actor_rollout_ref.rollout.val_kwargs.temperature: 0.6
actor_rollout_ref.rollout.val_kwargs.top_p: 0.95
actor_rollout_ref.rollout.val_kwargs.top_k: 20
actor_rollout_ref.rollout.val_kwargs.n: 1
actor_rollout_ref.rollout.max_model_len: 8192
data.train_batch_size: 16
data.val_batch_size: 140
data.dataloader_num_workers: 0
data.max_prompt_length: 4096
env.max_steps: 50
env.history_length: 2
env.alfworld.prompt_style: explicit_reasoning
env.alfworld.require_think_tags: false
env.alfworld.accumulate_chat_history: false
env.alfworld.allow_partial_validation_wave: true
algorithm.hint_ladder.level: L1
algorithm.hint_ladder.bank_dir: null
algorithm.hint_ladder.online.enable: true
algorithm.hint_ladder.online.model: glm-5.3-flash
algorithm.hint_ladder.online.base_url: https://YOUR_OPENAI_COMPATIBLE_ENDPOINT/v1
algorithm.hint_ladder.online.api_key_file: .secrets/glm_hint_key
algorithm.hint_ladder.online.prompt_path: configs/experiments/l1_online_full_20260910/l1_prompt.txt
algorithm.hint_ladder.online.temperature: 0.7
algorithm.hint_ladder.online.seed: 42
algorithm.hint_ladder.monitor_top1: true
trainer.total_epochs: 1
trainer.total_training_steps: 223
trainer.val_before_train: false
trainer.test_freq: 25
trainer.save_freq: 25
trainer.save_first_step: true
trainer.max_actor_ckpt_to_keep: 3
stage.train_games: data/game_lists/alfworld_train_full.txt
stage.validation_games:
  valid_seen: data/game_lists/alfworld_valid_seen_full.txt
  valid_unseen: data/game_lists/alfworld_valid_unseen_full.txt
stage.pad_train_to_batch: true

# --- fast: 128 episodes per step instead of 16 ------------------------------
# PG=0, so the GRPO group size never enters the loss; n only sets how many
# sequences each GPU decodes at once. Decode is memory-bound: 16 per GPU costs
# about the same wall time as 2, so per-episode cost drops ~8x.
env.rollout.n: 8

# --- fast: one weight sync + wake/sleep per rollout, not per turn ------------
# Without this every turn re-enters the vLLM sharding manager (~3 s x 50 turns).
actor_rollout_ref.rollout.keep_engine_awake_during_multiturn: true

# --- fast: CUDA graphs. vllm_rollout_spmd asserts free_cache_engine=false. ---
actor_rollout_ref.rollout.enforce_eager: false
actor_rollout_ref.rollout.free_cache_engine: false

# --- fast: cap runaway responses. Normal max is ~440 tokens, mean ~220; -----
# a single 4096-token response holds every sequence on that GPU for ~2 min.
data.max_response_length: 1024

# --- fast: batch sizes for the non-rollout phases -----------------------------
# 16384 prefill tokens fits 16 prompts of ~500 tokens in one batch.
# 32768 for log-prob OOMs: full-vocab entropy is materialised in fp32.
actor_rollout_ref.rollout.max_num_batched_tokens: 16384
actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 16384
actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 12288

# --- fast: one validation wave per split (seen 140, unseen 134 partial) ----
env.alfworld.val_parallelism: 140

# --- fast: fewer trace dumps ------------------------------------------------
trainer.rollout_dump_freq: 5

# --- hint API: thinking stays on at low effort; requests are prefetched during
# the rollout, so their latency is hidden. Timeouts are bounded and states that
# still fail are trained as L0 rows within a small per-step budget.
algorithm.hint_ladder.online.thinking: true
algorithm.hint_ladder.online.reasoning_effort: low
algorithm.hint_ladder.online.max_tokens: 768
algorithm.hint_ladder.online.concurrency: 128
algorithm.hint_ladder.online.timeout: 25
algorithm.hint_ladder.online.retries: 4
algorithm.hint_ladder.online.failure_budget_ratio: 0.01
algorithm.hint_ladder.online.failure_budget_max: 10
# Per-request files (~7000 per step) are only useful for mid-step resume;
# hints are archived in the rollout dumps instead.
algorithm.hint_ladder.online.persist_requests: false

# --- outputs -----------------------------------------------------------------
trainer.project_name: alfworld-l1-online-full-fast
stage.output_dir: runs/l1_online_full_fast/train
stage.processed_dir: runs/l1_online_full_fast/processed
ray_init._temp_dir: /tmp/ray_l1_online_full_fast
ray_init.runtime_env.env_vars.WANDB_PROJECT: alfworld-l1-online-full-fast
ray_init.runtime_env.env_vars.WANDB_DIR: runs/l1_online_full_fast/wandb
ray_init.runtime_env.env_vars.WANDB_MODE: online
