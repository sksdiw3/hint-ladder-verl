stage.output_dir: data/hint_bank/glm53flash_v1
stage.privilege_banks:
- data/privilege/alfworld_train.jsonl
- data/privilege/alfworld_valid_seen.jsonl
- data/privilege/alfworld_valid_unseen.jsonl
stage.game_lists:
- data/game_lists/alfworld_train_256.txt
- data/game_lists/alfworld_valid_seen_128.txt
- data/game_lists/alfworld_valid_unseen_128.txt
stage.levels:
- L1
- L2
- L3
- FULLPATH
stage.generator:
  base_url: https://your-glm-gateway.example/v1
  model: glm-5.3-flash
  api_key_file: .secrets/glm_hint_key
  reasoning_effort: low
  temperature: 0.7
  max_tokens: 4096
  attempts: 3
  concurrency: 2
  prompt_version: v1
  timeout: 180
