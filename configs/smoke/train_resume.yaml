extends:
- ../base_alfworld_qwen3_4b.yaml
- ../presets/sd_only.yaml
actor_rollout_ref.model.path: /models/Qwen3-4B
algorithm.hint_ladder.bank_dir: data/smoke/glm53flash_hint_bank_v2
algorithm.hint_ladder.level_map_path: configs/smoke/mixed_level_map.json
stage.train_games: data/smoke/refresh_games.txt
stage.validation_games:
  valid_seen: data/smoke/valid_seen_games.txt
  valid_unseen: data/smoke/valid_unseen_games.txt
trainer.n_gpus_per_node: 2
data.train_batch_size: 2
data.val_batch_size: 2
env.rollout.n: 2
env.alfworld.val_parallelism: 1
env.max_steps: 3
actor_rollout_ref.rollout.val_kwargs.n: 1
actor_rollout_ref.actor.ppo_mini_batch_size: 4
actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
actor_rollout_ref.actor.use_torch_compile: false
actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
actor_rollout_ref.rollout.enforce_eager: true
actor_rollout_ref.rollout.gpu_memory_utilization: 0.3
actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 8192
actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 8192
trainer.total_training_steps: 3
trainer.test_freq: 1
trainer.save_freq: 1
trainer.rollout_dump_freq: 1
ray_init.num_cpus: 8
ray_init.include_dashboard: false
ray_init.object_store_memory: 1073741824
trainer.val_before_train: false
algorithm.hint_ladder.reset_dataloader: true
algorithm.hint_ladder.active_token_budget: 237
